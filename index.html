<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dashboard</title>
</head>
<body>
    <div class="container">
        <div class="header">
            <!--Top Header-->
            <div class="top-header">
                <div class="top-header-left">
                    <img src="icon-kit/magnify.svg" alt="search" class="icon">
                    <input type="text" class="input-text">
                </div>
                <div class="top-header-right">
                    <div>
                        <img src="icon-kit/bell-ring.svg" alt="notification" class="icon">
                        <img src="pfp/img4.jpg" alt="profile" class="header-profile">
                    </div>
                    <p class="user-name">Wahyu Isnaeni</p>
                </div>                
            </div>
            <!--Bottom header-->
            <div class="bottom-header">
                <div class="bottom-header-left">
                    <div class="profile">
                        <img src="pfp/img4.jpg" alt="" class="profile">
                    </div>
                    <div class="user-info">
                        <div class="greetings"><p>Hi there,</p></div>
                        <div class="bottom-header user-name"><p>Wahyu Isnaeni (@Ways1337)</p></div>
                    </div>
                </div>
                
                <div class="bottom-header-right">
                    <div class="button-event"></div>
                    <div class="button-event"></div>
                    <div class="button-event"></div>
                </div>
            </div>
        </div>

        <div class="sidebar">
            <div></div>
            <div></div>
            <div></div>
        </div>

        <div class="content">
            <h2></h2>
            <div></div>
            <div></div>
        </div>
        <div class="misc"></div>
    </div>
</body>
</html>
